version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qwenimageflow-orquestrador-de-geracao-de-imagens-com-quantizacao-local-e-rag-app
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - SAAS_MASTER_SECRET=dev-master-secret-replace-in-prod
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => r.ok ? process.exit(0) : process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
